name: Generate WoodEscape Levels

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        range:
          - [0, 99]
          - [100, 199]
          - [200, 299]
          - [300, 399]
          - [400, 499]
          - [500, 599]
          - [600, 699]
          - [700, 799]
          - [800, 899]
          - [900, 999]
          - [1000, 1099]
          - [1100, 1199]
          - [1200, 1299]
          - [1300, 1399]
          - [1400, 1499]
          - [1500, 1599]
          - [1600, 1699]
          - [1700, 1799]
          - [1800, 1899]
          - [1900, 1999]
          - [2000, 2099]
          - [2100, 2199]
          - [2200, 2299]
          - [2300, 2399]
          - [2400, 2499]
          - [2500, 2599]
          - [2600, 2699]
          - [2700, 2799]
          - [2800, 2899]
          - [2900, 2999]
          - [3000, 3099]
          - [3100, 3199]
          - [3200, 3299]
          - [3300, 3399]
          - [3400, 3499]
          - [3500, 3599]
          - [3600, 3699]
          - [3700, 3799]
          - [3800, 3899]
          - [3900, 3999]
          - [4000, 4099]
          - [4100, 4199]
          - [4200, 4299]
          - [4300, 4399]
          - [4400, 4499]
          - [4500, 4599]
          - [4600, 4699]
          - [4700, 4799]
          - [4800, 4899]
          - [4900, 4999]
          - [5000, 5099]
          - [5100, 5199]
          - [5200, 5299]
          - [5300, 5399]
          - [5400, 5499]
          - [5500, 5599]
          - [5600, 5699]
          - [5700, 5799]
          - [5800, 5899]
          - [5900, 5999]
          - [6000, 6099]
          - [6100, 6199]
          - [6200, 6299]
          - [6300, 6399]
          - [6400, 6499]
          - [6500, 6599]
          - [6600, 6626] # বাকি ২৬টি লেভেল

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate specific failed levels
        run: |
          dart run tool/generate_specific_levels.dart \
            ${{ matrix.range[0] }} \
            ${{ matrix.range[1] }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixed-levels-${{ matrix.range[0] }}-${{ matrix.range[1] }}
          path: assets/levels/
          retention-days: 30