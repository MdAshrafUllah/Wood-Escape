name: Generate WoodEscape Levels

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        range:
          - [0, 1325]
          - [1326, 2651]
          - [2652, 3977]
          - [3978, 5303]
          - [5304, 6626]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          channel: "stable"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate specific failed levels
        run: |
          dart run tool/generate_specific_levels.dart \
            ${{ matrix.range[0] }} \
            ${{ matrix.range[1] }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixed-levels-${{ matrix.range[0] }}-${{ matrix.range[1] }}
          path: assets/levels/
          retention-days: 30
