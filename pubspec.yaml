name: woodescape
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  test: ^1.30.0
  equatable: ^3.0.0
  flutter_riverpod: ^3.3.2
  json_annotation: ^4.12.0
  go_router: 14.0.0
  shared_preferences: ^2.5.5
  local_auth: ^3.0.2
  audioplayers: ^6.7.1
  vibration: ^3.2.1
  easy_localization: ^3.0.8
  intl: ^0.20.2
  url_launcher: ^6.3.0
  share_plus: ^10.1.0
  package_info_plus: ^8.1.0
  in_app_review: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  json_serializable: ^6.14.1
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  meta: ^1.18.0

flutter:
  uses-material-design: true
  assets:
    - assets/audios/
    - assets/translations/
    - assets/images/

flutter_native_splash:
  color: "#1E0E07"
  color_dark: "#1E0E07"
  image: assets/images/wood_escape_logo.png
  fullscreen: true

  android: true
  android_gravity: center

  android_12:
    color: "#100500"
    icon_background_color: "#100500"
    image: assets/images/wood_escape_logo_12.png
    icon_background_color_dark: "#100500"

  ios: true
  ios_content_mode: center

  web: true

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/wood_escape_logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/images/wood_escape_logo.png"
    background_color: "#100500"
    theme_color: "#100500"
  windows:
    generate: true
    image_path: "assets/images/wood_escape_logo.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/images/wood_escape_logo.png"
